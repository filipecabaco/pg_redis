# Two panes and nothing else: no status bar, titled borders, mouse to switch panes.
set -g status off
set -g mouse on
set -g escape-time 25
set -g default-terminal "tmux-256color"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#3ecf8e bold],#[fg=#6a6a6a]}#{pane_title}"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#3ecf8e"
set -g pane-border-lines heavy

# The docs page drives the panes with these: alt-1 is redis-cli, alt-2 is psql
bind -n M-1 select-pane -t 0
bind -n M-2 select-pane -t 1
