[vars]
pg_version = "pg17"

[tasks.fmt]
description = "Format Rust code"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint with clippy (warnings as errors)"
run = "cargo clippy --features {{vars.pg_version}} -- -D warnings"

[tasks.build]
description = "Build the extension"
run = "cargo build --features {{vars.pg_version}}"

[tasks.run]
description = "Start a local postgres with the extension hot-reloaded"
run = "cargo pgrx run {{vars.pg_version}}"

[tasks.fmt-check]
description = "Check formatting (mirrors CI)"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Run fmt-check + clippy (mirrors CI check step)"
depends = ["fmt-check", "lint"]

[tasks.fix]
description = "Auto-fix formatting and lints, then run tests for all pg versions"
run = """
set -e

die() {
  echo "✗ FAILED at: $1" >&2
  exit 1
}

echo '══ Step 1/3: Formatting ════════════════════════════════'
cargo fmt --all || die "cargo fmt --all"

echo '══ Step 2/3: Clippy auto-fix ═══════════════════════════'
cargo clippy --fix --allow-dirty --features {{vars.pg_version}} -- -D warnings || die "cargo clippy --fix (pg_version={{vars.pg_version}})"

echo '══ Step 3/3: Tests (all pg versions) ═══════════════════'
cargo pgrx test pg15 || die "cargo pgrx test pg15"
cargo pgrx test pg16 || die "cargo pgrx test pg16"
cargo pgrx test pg17 || die "cargo pgrx test pg17"
"""

[tasks.test-unit]
description = "Run unit tests (no postgres required)"
run = "cargo test --features {{vars.pg_version}} --lib -- --skip pg_test"

[tasks.test-pg]
description = "Run integration tests with pgrx managed postgres"
run = "cargo pgrx test {{vars.pg_version}}"

[tasks.test-pg15]
description = "Run integration tests against PostgreSQL 15"
run = "cargo pgrx test pg15"

[tasks.test-pg16]
description = "Run integration tests against PostgreSQL 16"
run = "cargo pgrx test pg16"

[tasks.test-pg17]
description = "Run integration tests against PostgreSQL 17"
run = "cargo pgrx test pg17"

[tasks.test-all-pg]
description = "Run integration tests for all supported pg versions sequentially"
run = [
  "cargo pgrx test pg15",
  "cargo pgrx test pg16",
  "cargo pgrx test pg17",
]

[tasks.test]
description = "Run all tests (unit + pgrx integration)"
depends = ["test-unit", "test-pg"]

[tasks.e2e]
description = "Run end-to-end tests in Docker (redis-cli based)"
run = [
  "docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile e2e up --build --abort-on-container-exit --exit-code-from e2e",
  "docker compose --profile e2e down -v",
]

[tasks.parity]
description = "Diff every reply against a real Redis (both halves)"
run = [
  "docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile parity up --build --abort-on-container-exit --exit-code-from parity",
  "docker compose --profile parity down -v",
]

[tasks.parity-update]
description = "Re-record the parity baseline after a difference is fixed or accepted"
run = [
  "docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile parity run --build --rm -v $PWD/docker/e2e:/app parity bun run parity.ts --update-baseline",
  "docker compose --profile parity down -v",
]

[tasks.acceptance]
description = "Run Redis's own Tcl test suite against pg_redis (both halves), gated on the baseline"
env = { PG_REDIS_PASSWORD = "", PG_REDIS_DEFAULT_DB = "0" }
run = [
  "docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile acceptance up --build --abort-on-container-exit --exit-code-from acceptance",
  "docker compose --profile acceptance down -v",
]

[tasks.acceptance-update]
description = "Re-record the acceptance baseline after tests start passing (or a regression is accepted)"
env = { PG_REDIS_PASSWORD = "", PG_REDIS_DEFAULT_DB = "0" }
run = [
  "docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile acceptance run --build --rm -v $PWD/docker/acceptance:/opt/redis/acceptance acceptance bun run acceptance/run.ts --update-baseline",
  "docker compose --profile acceptance down -v",
]

[tasks.clients]
description = "Run client-compatibility e2e tests in Docker (node-redis, ioredis)"
run = [
  "docker compose --profile clients up --build --abort-on-container-exit --exit-code-from clients",
  "docker compose --profile clients down -v",
]

[tasks.bench]
description = "Run the full redis-benchmark suite against pg_redis (:6379) and Redis (:6380)"
run = """
set -e
docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile bench up -d --build --wait
trap 'docker compose --profile bench down' EXIT INT TERM
sleep 2

run_suite() {
  label=$1; host=$2
  echo ''
  echo "══ $label ═══════════════════════════════════════════"
  for t in ping set get incr lpush rpush lpop rpop sadd hset spop zadd zpopmin lrange mset; do
    docker compose exec -T redis redis-benchmark \\
        -h $host -p 6379 -a testpass -n 20000 -c 50 -q -t $t 2>/dev/null \\
      | tr '\\r' '\\n' \\
      | grep 'requests per second' \\
      || echo " $t: <connection closed>"
  done
}

run_suite 'Redis 7 (reference)' redis
run_suite 'pg_redis' postgres
"""

[tasks.bench-report]
description = "Benchmark memory mode against Redis and print the markdown CI posts on a PR"
run = """
set -e
PG_REDIS_DEFAULT_DB=0 \
  docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile bench up -d --build --wait
trap 'docker compose --profile bench down' EXIT INT TERM
bash docker/bench/report.sh
"""

[tasks.bench-value-sizes]
description = "Benchmark SET/GET across the value-size boundaries the default -d 3 never reaches"
run = """
set -e
# Memory mode on db 0: the inline slot and the chunk pool this sweeps only
# exist there. The compose default is the durable half, where every size is a
# bytea column and the boundaries do not exist.
PG_REDIS_DEFAULT_DB=0 \
  docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile bench up -d --build --wait
trap 'docker compose --profile bench down' EXIT INT TERM
sleep 2

# redis-benchmark defaults to 3-byte values, so the standard suite never leaves
# the 64-byte inline slot. These sizes straddle every boundary the memory
# backend has: the inline slot, the first chunk of the value pool, several
# chunks, and the 64 KiB cap.
for d in 3 63 64 65 200 512 4096 65536; do
  echo ''
  echo "══ value size ${d} bytes ═══════════════════════════════"
  for t in set get; do
    docker compose exec -T redis redis-benchmark \\
        -h postgres -p 6379 -a testpass -n 20000 -c 50 -d $d -q -t $t 2>/dev/null \\
      | tr '\\r' '\\n' \\
      | grep 'requests per second' \\
      || echo " $t: <connection closed>"
  done
done
"""

[tasks.bench-high-write]
description = "High-concurrency write benchmark: 8 workers, batch_size=256, 200 clients"
run = """
set -e
PG_REDIS_WORKERS=8 PG_REDIS_BATCH_SIZE=256 docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile bench up -d --build --wait
trap 'docker compose --profile bench down' EXIT INT TERM
sleep 2

run_suite() {
  label=$1; host=$2
  echo ''
  echo "══ $label ═══════════════════════════════════════════"
  for t in set get incr hset zadd lpop sadd zpopmin rpop spop; do
    docker compose exec -T redis redis-benchmark \\
        -h $host -p 6379 -a testpass -n 50000 -c 200 -q -t $t 2>/dev/null \\
      | tr '\\r' '\\n' \\
      | grep 'requests per second' \\
      || echo " $t: <connection closed>"
  done
}

run_suite 'Redis 7 (reference, 200 clients)' redis
run_suite 'pg_redis (8 workers, batch_size=256, 200 clients)' postgres
"""

[tasks.bench-pubsub]
description = "Pub/Sub throughput benchmark against pg_redis (:6379) and Redis (:6380)"
run = """
set -e
docker compose -f docker-compose.yml -f docker-compose.noports.yml --profile bench up -d --build --wait
trap 'docker compose --profile bench down' EXIT INT TERM
sleep 2

echo ''
echo '══ Redis 7 (reference) ══════════════════════════════════════'
REDIS_HOST=localhost REDIS_PORT=6380 REDIS_PASSWORD=testpass \
  bun run docker/e2e/bench_pubsub.ts

echo ''
echo '══ pg_redis ════════════════════════════════════════════════'
docker run --rm --network pg_redis_default \
  -e REDIS_HOST=postgres -e REDIS_PORT=6379 -e REDIS_PASSWORD=testpass \
  -v "$(pwd)/docker/e2e:/app" \
  oven/bun:latest bun run /app/bench_pubsub.ts

echo ''
echo '══ pg_redis (with table routing) ═══════════════════════════'
docker run --rm --network pg_redis_default \
  -e REDIS_HOST=postgres -e REDIS_PORT=6379 -e REDIS_PASSWORD=testpass \
  -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres \
  -v "$(pwd)/docker/e2e:/app" \
  oven/bun:latest bun run /app/bench_pubsub.ts
"""

[tasks.og]
description = "Re-render docs/assets/og.png (the social card) from scripts/og.html"
run = """
CHROME="${CHROME:-/Applications/Google Chrome.app/Contents/MacOS/Google Chrome}"
"$CHROME" --headless=new --disable-gpu --hide-scrollbars \\
  --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=5000 \\
  --screenshot=docs/assets/og.png "file://$PWD/scripts/og.html"
"""

[tasks.docs]
description = "Serve the docs site locally with live reload"
run = 'uvx --from "mkdocs>=1.6,<2" --with mkdocs-material mkdocs serve'

[tasks.demo]
description = "Build the in-browser demo (docker/demo, via snowglobe) into docs/demo/"
run = """
set -e
SNOWGLOBE="${SNOWGLOBE:-snowglobe}"
docker build --platform linux/arm64 -t pg_redis:alpine-arm64 .
docker build --platform linux/arm64 -t pg_redis:examples-arm64 examples
rm -rf docs/demo
"$SNOWGLOBE" build docker/demo --out docs/demo
SNOWGLOBE="$SNOWGLOBE" elixir docker/demo/warm.exs
"""

[tasks.bench-suite]
description = "Benchmark the four storage policies against Redis on pinned CPUs (docker/bench/suite.exs)"
run = "elixir docker/bench/suite.exs"
