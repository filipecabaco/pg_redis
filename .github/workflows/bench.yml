name: Site benchmarks

# The throughput figures the site shows, measured here rather than typed in: every change to
# main that can move them runs docker/bench/suite.exs, which benchmarks pg_redis's storage
# policies against Redis 7.2 on this runner, and uploads its report as the `bench` artifact.
# The docs workflow downloads the latest one and renders it (hooks/bench.py), and runs
# again when this finishes, so the site follows main without anyone copying numbers.
#
# A pull request that changes the rig runs it too, to check it still produces a report; only
# main's reports reach the site.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sql/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker/bench/suite.exs"
      - "docker/bench/compose.yml"
      - ".github/workflows/bench.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/bench/suite.exs"
      - "docker/bench/compose.yml"
      - ".github/workflows/bench.yml"
  # Weekly as well: the artifact keeps 90 days, and a quiet main must not leave the site
  # without figures.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer commit's figures replace an older one's, so an older run still going is wasted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'Cargo.toml', 'Cargo.lock', 'src/**', 'sql/**') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pg_redis:latest
          cache-from: type=local,src=/tmp/.buildx-cache

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.18"

      # The runner has four CPUs: two for the server under test, two for the load. Half the
      # requests of a local run and three repetitions keep it inside half an hour.
      - name: Run the suite
        env:
          BENCH_SERVER_CPUS: "0-1"
          BENCH_LOAD_CPUS: "2-3"
          BENCH_REPS: "3"
          BENCH_SCALE: "0.5"
          BENCH_HOST: "GitHub-hosted runner (ubuntu-latest, 4 vCPUs)"
          BENCH_OUT: bench/bench
        run: elixir docker/bench/suite.exs

      - name: Publish to the job summary
        run: cat bench/bench.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: bench/
          retention-days: 90
