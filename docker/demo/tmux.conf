# Two panes and nothing else: no status bar, titled borders, mouse to switch panes.
set -g status off
set -g mouse on
set -g escape-time 25
set -g default-terminal "tmux-256color"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#3ecf8e bold],#[fg=#6a6a6a]}#{pane_title}"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#3ecf8e"
set -g pane-border-lines heavy

# The docs pages drive the panes with these: alt-1 is redis-cli, alt-2 is psql (both in the first
# window), alt-3 the shell in /examples where the showcases run (a window of its own)
bind -n M-1 select-window -t demo \; select-pane -t demo.0
bind -n M-2 select-window -t demo \; select-pane -t demo.1
bind -n M-3 select-window -t app
