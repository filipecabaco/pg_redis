services:
  postgres:
    build: .
    image: pg_redis:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
      - "6379:6379"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      postgres
        -c shared_preload_libraries=pg_redis
        -c redis.port=6379
        -c redis.listen_address=0.0.0.0
        -c redis.default_db=${PG_REDIS_DEFAULT_DB:-8}
        -c redis.workers=${PG_REDIS_WORKERS:-4}
        -c redis.batch_size=${PG_REDIS_BATCH_SIZE:-64}
        -c redis.password=${PG_REDIS_PASSWORD-testpass}
        -c redis.aclfile=${PG_REDIS_ACLFILE-}
    # Healthy means both listeners are up: PostgreSQL accepting connections
    # is not the same as the pg_redis workers having bound their port, and a
    # suite that connects in between fails with ECONNREFUSED before any test.
    # PostgreSQL is asked over TCP: the image's first-boot init runs a
    # temporary server, pg_redis and all, on the Unix socket alone, and a
    # suite let in then is cut off when it stops for the real start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres && nc -z 127.0.0.1 6379"]
      interval: 2s
      timeout: 5s
      retries: 15

  e2e:
    build: ./docker/e2e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: postgres
      REDIS_PORT: "6379"
      REDIS_PASSWORD: testpass
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
    network_mode: "service:postgres"
    profiles: ["e2e"]

  # Production-style apps on Redis libraries (BullMQ, connect-redis,
  # rate-limit-redis, the Socket.IO Redis adapter, streams), unchanged.
  showcases:
    build: ./examples
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${PG_REDIS_PASSWORD-testpass}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    network_mode: "service:postgres"
    profiles: ["showcases"]

  parity:
    build: ./docker/e2e
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PG_REDIS_HOST: postgres
      PG_REDIS_PORT: "6379"
      PG_REDIS_PASSWORD: testpass
      REDIS_REF_HOST: redis
      REDIS_REF_PORT: "6379"
      REDIS_REF_PASSWORD: testpass
    command: ["bun", "run", "parity.ts"]
    profiles: ["parity"]

  # Redis's own Tcl suite, against pg_redis as an external server. Its client
  # cannot AUTH, so run this profile with PG_REDIS_PASSWORD set to empty, and
  # with PG_REDIS_DEFAULT_DB=0 so its --singledb pass reaches the memory half.
  acceptance:
    build: ./docker/acceptance
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_REDIS_HOST: postgres
      PG_REDIS_PORT: "6379"
    profiles: ["acceptance"]

  clients:
    build: ./docker/clients
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: postgres
      REDIS_PORT: "6379"
    network_mode: "service:postgres"
    profiles: ["clients"]

  redis:
    # The reference for parity: the Redis version pg_redis matches, pinned
    # so a new 7.x tag cannot move it. The Debian image, on glibc, as most
    # Redis runs: Alpine's musl strtold rounds some out-of-range floats
    # differently.
    image: redis:7.2
    command: ["redis-server", "--requirepass", "testpass"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a testpass ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 15
    profiles: ["bench", "parity"]
