name: Update pgrx

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: update-pgrx
  cancel-in-progress: true

jobs:
  update-pgrx:
    name: Check and update pgrx
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get current pgrx version
        id: current
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^pgrx = "=([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' Cargo.toml)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: could not parse current pgrx version from Cargo.toml (got: '$VERSION')" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest pgrx version from crates.io
        id: latest
        run: |
          set -euo pipefail
          LATEST=$(curl -sf --connect-timeout 10 --max-time 30 \
            -H "User-Agent: pg_redis-ci-updater (github.com/filipecabaco/pg_redis)" \
            https://crates.io/api/v1/crates/pgrx \
            | jq -r '.crate.max_stable_version // .crate.max_version')
          if [[ ! "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: unexpected version from crates.io (got: '$LATEST')" >&2
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Check for existing PR or branch
        id: existing
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="update-pgrx-${NEW}"
          # Check open AND merged/closed PRs to avoid re-opening for an already-handled version
          PR=$(gh pr list --head "$BRANCH" --state all --json number --jq '.[0].number // empty')
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.existing.outputs.pr == ''
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Update pgrx version in files
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.existing.outputs.pr == ''
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail

          # Use | as sed delimiter to avoid conflicts with version dots
          sed -i "s|pgrx = \"=${OLD}\"|pgrx = \"=${NEW}\"|" Cargo.toml
          sed -i "s|pgrx-tests = \"=${OLD}\"|pgrx-tests = \"=${NEW}\"|" Cargo.toml

          # Cargo.toml already pins the new version; update the lock file to match
          cargo update -p pgrx -p pgrx-tests

      - name: Open pull request
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.existing.outputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.latest.outputs.version }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: update pgrx ${OLD} -> ${NEW}"
          # Recreated from main on every run, and named for the version it
          # targets, so the remote copy is only ever a previous attempt at the
          # same bump. A plain push fails the moment one of those is left behind
          # — which is what happens whenever the PR step could not complete.
          git push --force origin "$BRANCH"

          # Build the body in a heredoc. Writing it inline would need blank and
          # unindented lines, which end the enclosing YAML block scalar and make
          # the whole workflow file unparseable.
          cat > /tmp/pr-body.md <<BODY
          Automated update of pgrx from \`${OLD}\` to \`${NEW}\`.

          Changes:
          - \`Cargo.toml\`: \`pgrx\` and \`pgrx-tests\` dependencies
          - \`Cargo.lock\`: updated lock entries

          CI will run the full test matrix (pg15, pg16, pg17) automatically.
          BODY

          # Opening the PR needs "Allow GitHub Actions to create and approve pull
          # requests" (Settings > Actions > General). That is a repository
          # setting, not a token permission a workflow can ask for, so treat it
          # as optional: the branch is pushed either way, and the useful work —
          # the dependency bump, committed and ready — is already done.
          if gh pr create \
              --title "chore: update pgrx ${OLD} -> ${NEW}" \
              --body-file /tmp/pr-body.md \
              --base main \
              --head "$BRANCH"; then
            exit 0
          fi

          echo "::notice::Pushed ${BRANCH}, but could not open the pull request." \
               "Enable 'Allow GitHub Actions to create and approve pull requests'" \
               "in Settings > Actions > General to automate this step."
          echo "Open it manually: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BRANCH}?expand=1"

      - name: Already up to date
        if: steps.latest.outputs.version == steps.current.outputs.version
        run: echo "pgrx is already at the latest version (${{ steps.current.outputs.version }})"
