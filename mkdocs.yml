site_name: pg_redis
site_description: A Redis server inside PostgreSQL. Any Redis client, port 6379, with a storage policy per database, from shared memory to WAL-logged tables you can query in SQL.
site_url: https://filipecabaco.github.io/pg_redis
repo_url: https://github.com/filipecabaco/pg_redis
repo_name: filipecabaco/pg_redis
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Filipe Cabaço — MIT License

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit

# The throughput figures, from the report CI measured (hooks/bench.py)
hooks:
  - hooks/bench.py

extra_css:
  - stylesheets/supabase.css
  - stylesheets/home.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/filipecabaco/pg_redis
    - icon: simple/supabase
      link: https://supabase.com

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      # The examples page finds its runnable blocks by language (demo.js)
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Configuration: configuration.md
      - Examples: examples.md
      - Operating in production: operations.md
      - Storage policies: STORAGE.md
  - Reference:
      - Commands: commands.md
      - Command coverage: command-coverage.md
  - Implementation: IMPLEMENTATION.md
  - Parity roadmap: PARITY.md
